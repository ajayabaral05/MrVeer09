<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grow With Patience</title>

  <!-- ══════════════════════════════════════

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 28px 30px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 6px 40px rgba(0,0,0,0.12);
    }

    /* Avatar */
    .avatar-wrap { display: inline-block; margin-bottom: 20px; }
    .avatar-wrap img {
      width: 140px; height: 140px;
      border-radius: 50%; object-fit: cover;
      border: 4px solid #dd0000; display: block;
    }

    /* Title */
    .title {
      font-size: 22px; font-weight: 900;
      color: #111; letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .title .mark { color: #cc0000; font-size: 28px; }

    /* ── CTA Button ── */
    .btn {
      display: block;
      background: #1a5bbf;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      border-radius: 50px;
      padding: 16px 0;
      text-decoration: none;
      margin-bottom: 24px;
      cursor: pointer;
      border: none;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: popPulse 1.8s ease-in-out infinite;
    }

    /* Popup / Bounce + Glow Pulse Animation */
    @keyframes popPulse {
      0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(26,91,191,0.70); }
      30%  { transform: scale(1.06); box-shadow: 0 0 0 10px rgba(26,91,191,0.30); }
      60%  { transform: scale(0.97); box-shadow: 0 0 0 18px rgba(26,91,191,0.08); }
      80%  { transform: scale(1.02); box-shadow: 0 0 0 22px rgba(26,91,191,0.00); }
      100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(26,91,191,0.00); }
    }

    .btn:active { transform: scale(0.95) !important; animation: none; }

    /* Ripple on click */
    .btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
      transform: scale(0);
      animation: rippleAnim 0.65s linear forwards;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(5); opacity: 0; }
    }

    /* Countdown */
    .countdown {
      display: flex; justify-content: center;
      align-items: flex-start; gap: 4px; margin-bottom: 8px;
    }
    .cd-block { display: flex; flex-direction: column; align-items: center; min-width: 58px; }
    .cd-num   { font-size: 38px; font-weight: 900; color: #e84444; line-height: 1.1; }
    .cd-sep   { font-size: 38px; font-weight: 900; color: #e84444; line-height: 1.1; padding: 0 2px; }
    .cd-label { font-size: 11px; font-weight: 700; color: #cc00aa; letter-spacing: 1.2px; margin-top: 4px; }

    /* Footer */
    .footer { margin-top: 18px; font-size: 14px; color: #111; font-weight: 600; }
    .footer .brand { color: #e84444; font-weight: 700; text-decoration: none; }
    .footer .brand:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">

    <div class="avatar-wrap">
      <!-- Replace with your actual photo URL -->
      <img src="photo.jpg" alt="Selfie Gamer" />
    </div>

    <div class="title">
      <span class="mark">‼</span> Grow With Patience <span class="mark">‼</span>
    </div>

    <!-- Button: Pixel fires ONLY on click with event name "Telegram Join" -->
    <a class="btn" id="joinBtn" href="https://t.me/+bDnf3qU4NAw5MzJl" target="_blank">
      ✈🚀 Join Free Telegram
    </a>

    <div class="countdown">
      <div class="cd-block"><div class="cd-num" id="cd-days">00</div><div class="cd-label">DAYS</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">HOURS</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-mins">05</div><div class="cd-label">MINUTES</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">SECONDS</div></div>
    </div>

    <div class="footer">Ads managed by <a class="brand" id="adsLink" href="https://t.me/Ajadsworld" target="_blank">Ads world</a></div>
  </div>

  <script>
    /* ── Countdown: 5 minutes = 300 seconds ── */
    let totalSeconds = 1 * 60;

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateTimer() {
      if (totalSeconds < 0) totalSeconds = 0;
      document.getElementById('cd-days').textContent  = pad(Math.floor(totalSeconds / 86400));
      document.getElementById('cd-hours').textContent = pad(Math.floor((totalSeconds % 86400) / 3600));
      document.getElementById('cd-mins').textContent  = pad(Math.floor((totalSeconds % 3600) / 60));
      document.getElementById('cd-secs').textContent  = pad(totalSeconds % 60);
      if (totalSeconds > 0) totalSeconds--;
    }
    updateTimer();
    setInterval(updateTimer, 1000);

    /* ── Button: Pixel fires ONLY on click — Event Name: "Telegram Join" ── */
    const btn = document.getElementById('joinBtn');

    btn.addEventListener('click', function(e) {

      /* Fire Meta Pixel custom event — name exactly: "Telegram Join" */
      if (typeof fbq === 'function') {
        fbq('track', 'Subscribe');
      }

      /* Ripple animation */
      const ripple   = document.createElement('span');
      ripple.classList.add('ripple');
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width  = ripple.style.height = size + 'px';
      ripple.style.left   = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top    = (e.clientY - rect.top  - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 700);
    });
  </script>

</body>
</html>
